# Hierarchical level names from outermost to innermost folder. Must match
# the actual folder structure of your content repo: levels[0] is the top
# folder name (e.g. "zone"), levels[1] is the next level down (e.g. "room"),
# and so on. wb_build queries use these names:
#     wb_build zone=millholm room=bakery
levels: [zone, room]

# NOT YET ACTIVE. Must be `false` — the library refuses to parse this
# file if you set it to `true`.
#
# Planned behaviour: when true, the validator will reject YAML-declared
# attributes whose key isn't declared on the entity's typeclass — catching
# typos like `loafs_avilable` that silently create junk attributes no game
# logic reads. Detection mechanism (typeclass introspection vs explicit
# allowlist on the typeclass vs other) is TBD.
#
# Why refuse rather than ignore? Because a consumer who flips this to
# true would believe attribute validation was running when in fact
# nothing is checked. False security is worse than no security. Setting
# this to false (or omitting it) is the only way the library can confirm
# you understand the feature isn't live yet.
strict-attributes: false
