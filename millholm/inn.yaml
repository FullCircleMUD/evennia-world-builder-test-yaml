# Demonstrates a paired bidirectional door using the world-builder
# `links:` mechanism. Both halves of the bakery↔inn door are declared
# as DemoDoor exits; the file-level `links:` block sets `other_side`
# on each so opening/closing one side mirrors to the partner.
#
# Per the cross-file convention in DESIGN/links.md, the same `links:`
# block is duplicated in millholm/bakery.yaml — that lets a partial
# rebuild of either file fully restore the door pair without help
# from a links-restoration mechanism in the library.

file_id: 006fab13-673e-47e7-9307-6365effa699f
entities:
  - entity_id: 28d0aac8-0106-4c30-91ea-df74b98e1ac8
    typeclass: evennia.objects.objects.DefaultRoom
    name: The Crooked Lantern
    location: null
    description: A warmly-lit common room with a roaring hearth and worn oak tables.
    # Spike: dict-of-dicts attribute with a `null` placeholder for a
    # cross-ref that gets resolved by a links: entry below using the
    # subscript-path attribute syntax. See `notable_neighbours` link
    # at the file-level links: section.
    attributes:
      - key: notable_neighbours
        value:
          south_door:
            label: The bakery (Goldencrust)
            room: null            # filled in by links: subscript-path
            walking_minutes: 1
          static_test:
            label: A literal entry, never touched by links
            counter: 42

    exits:
      - entity_id: 27030dd8-b228-471b-826a-dc33a86b1221
        typeclass: typeclasses.doors.DemoDoor
        name: south
        aliases: [s, bakery, door]
        description: A heavy wooden door leads south toward the bakery.
        destination:
          deployment_file: millholm/bakery.yaml
          deployment_id: 1

# Bakery's matching half cascade-deletes if this file's room is
# deleted (its destination becomes invalid). Declare it so pass 3
# rebuilds it from canonical bakery.yaml on isolated rebuilds.
incoming_exits:
  - { deployment_file: millholm/bakery.yaml, deployment_id: 7 }

# Both directional links — same content as bakery.yaml's `links:`.
links:
  - entity:    { deployment_file: millholm/inn.yaml, deployment_id: 2 }
    attribute: other_side
    points_to: { deployment_file: millholm/bakery.yaml, deployment_id: 7 }
  - entity:    { deployment_file: millholm/bakery.yaml, deployment_id: 7 }
    attribute: other_side
    points_to: { deployment_file: millholm/inn.yaml, deployment_id: 2 }

  # Spike: subscript-path attribute syntax. The leading bare identifier
  # `notable_neighbours` names a top-level attribute that already
  # exists on inn id 1 (created in pass 1 from the `attributes:` block
  # above with a `null` placeholder at ["south_door"]["room"]). Pass 4
  # walks the path and replaces the null with the resolved bakery
  # room. After build, examining inn id 1 should show:
  #   notable_neighbours["south_door"]["room"]    = bakery (live obj)
  #   notable_neighbours["south_door"]["label"]   = "The bakery (Goldencrust)"
  #   notable_neighbours["south_door"]["walking_minutes"] = 1
  #   notable_neighbours["static_test"]["counter"] = 42
  - entity:    { deployment_file: millholm/inn.yaml, deployment_id: 1 }
    attribute: 'notable_neighbours["south_door"]["room"]'
    points_to: { deployment_file: millholm/bakery.yaml, deployment_id: 1 }
