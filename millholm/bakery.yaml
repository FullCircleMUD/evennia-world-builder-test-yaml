# Multi-entity file in the canonical shape — top-level mapping with
# an `entities:` key. Two connected rooms in the millholm bakery
# district plus their nested contents and the exits between them.
#
# Connections:
#   Goldencrust Bakery  ←→  Baker's House
#   Goldencrust Bakery   →  The Crooked Lantern (millholm/inn.yaml)
#
# The reverse exit from the inn back to the bakery lives canonically in
# inn.yaml, registered here under `incoming_exits:` so a scoped rebuild
# of this file (`wb_build zone=millholm room=bakery`) restores it if the
# bakery cleanup cascade-deleted it. Pass 3 resolves the reference to
# its canonical file via the entity index and rebuilds it.

file_id: d3d35e78-de1e-4e5e-9dd0-321281213976
entities:
  - entity_id: bab596f3-aa25-4ec0-a916-cf472efece06
    typeclass: typeclasses.rooms.BakeryRoom
    name: Goldencrust Bakery
    location: null
    home: null
    aliases:
      - bakery
      - goldencrust
    description: |
      Smells of fresh bread, honey buns, and woodsmoke fill the warm air.
      A long counter runs the length of the south wall, fronted by glass
      cases of golden loaves and pastries. The brick oven at the back
      glows softly even in the early morning hours.
    locks: "examine:all();get:false();puppet:perm(Wizards)"
    tags:
      - bakery
      - commerce
      - { key: indoor, category: environment }
      - { key: warm, category: environment }
      - { key: millholm_town, category: district }
    attributes:
      # Override the typeclass at_object_creation default (10) per-instance.
      - { key: loaves_available, value: 24 }
      - { key: ambient_smell, value: "fresh bread and woodsmoke" }
      - { key: open_hours, value: [6, 18] }
      - { key: signature_recipe, value: { name: "honey loaf", flour_grams: 500, honey_grams: 75 }, category: bakery_specific }
      - { key: noise_level, value: quiet, category: ambient }

    contents:
      - entity_id: 7b6fa506-17fb-4cd4-8ea9-b3ddd2ec8139
        typeclass: evennia.objects.objects.DefaultObject
        name: brick oven
        aliases: [oven, hearth]
        description: A cavernous brick oven, its mouth glowing with embers.
        locks: "examine:all();get:false()"
        tags:
          - { key: fixture, category: object_kind }
          - { key: heat_source, category: function }
        attributes:
          - { key: temperature_c, value: 230 }
          - { key: fuel, value: oak_wood }

      - entity_id: 52d10386-d06a-4514-b684-a4cb7d7e797c
        typeclass: evennia.objects.objects.DefaultObject
        name: bread display case
        aliases: [display, case, counter]
        description: Sloped glass shelves displaying the day's loaves.
        locks: "examine:all();get:false()"
        tags:
          - fixture
          - { key: glass, category: material }
        attributes:
          - { key: capacity, value: 24 }

      - entity_id: 1b836927-3cca-4e05-8bd4-e7a0f1cde914
        typeclass: evennia.objects.objects.DefaultObject
        name: Mira the baker
        aliases: [mira, baker]
        description: A flour-dusted woman with kind eyes and forearms like cordwood.
        locks: "examine:all();get:false();attack:false()"
        tags:
          - npc
          - merchant
          - { key: friendly, category: disposition }
        attributes:
          - { key: greeting, value: "Morning! Smell that? Just out of the oven." }
          - { key: shop_inventory, value: [honey_loaf, rye_loaf, sweet_bun], category: merchant_data }

      - entity_id: 5adf18ba-c37a-4356-9656-c874a45cb326
        typeclass: evennia.objects.objects.DefaultObject
        name: a fresh honey loaf
        aliases: [loaf, bread, honey loaf]
        description: A golden, glossy loaf still warm from the oven.
        locks: "examine:all();get:all()"
        tags:
          - food
          - { key: bakery_goods, category: item_kind }
        attributes:
          - { key: nutrition, value: 25 }
          - { key: weight_grams, value: 800 }

    exits:
      - entity_id: db662d8a-a8b1-4c84-93a1-516855a2f691
        typeclass: typeclasses.doors.DemoDoor
        name: north
        aliases: [n, inn, door]
        description: A heavy wooden door leads north toward the Crooked Lantern.
        destination: 28d0aac8-0106-4c30-91ea-df74b98e1ac8
      - entity_id: 039e3725-b733-4972-b06c-cea2b82d1af7
        typeclass: evennia.objects.objects.DefaultExit
        name: south
        aliases: [s, house]
        description: A door at the back leads through to the baker's house.
        destination: 5bfb8612-5e26-402f-81de-9fecaa0c9afe
  - entity_id: 5bfb8612-5e26-402f-81de-9fecaa0c9afe
    typeclass: typeclasses.rooms.Room
    name: Baker's House
    location: null
    # Home reference demo: the Baker's House's home is the bakery. The
    # Builder resolves it and passes `home=<bakery obj>` to
    # create_object, so the resulting room's `home` field points there.
    home: bab596f3-aa25-4ec0-a916-cf472efece06
    aliases:
      - house
    description: |
      The baker's modest living quarters, just behind the bakery proper.
    locks: "examine:all();get:false();puppet:perm(Wizards)"
    tags:
      - { key: indoor, category: environment }
      - { key: warm, category: environment }
      - { key: millholm_town, category: district }

    contents:
      - entity_id: d7cd3458-be03-4f7c-a6d5-8068580f5a08
        typeclass: evennia.objects.objects.DefaultObject
        name: ornate four-post bed
        aliases: [bed]
        description: An ornate four-post bed.
        locks: "examine:all();get:false()"
        tags:
          - { key: fixture, category: object_kind }
        attributes:
          - { key: weight_grams, value: 800 }

    exits:
      - entity_id: 86ea589d-3b73-49d6-948b-4a4d28212be9
        typeclass: evennia.objects.objects.DefaultExit
        name: north
        aliases: [n, bakery]
        description: The bakery is just back the way you came.
        destination: bab596f3-aa25-4ec0-a916-cf472efece06
# File-level metadata. Sibling of `entities:` per the canonical shape.
# Each entry references an exit living in another file that terminates
# at one of this file's rooms. When this file is rebuilt and a
# registered target is missing from the database, pass 3 rebuilds it
# from its canonical file, tagged with that file's id so future cleanup
# there sweeps it correctly.
incoming_exits:
  - 27030dd8-b228-471b-826a-dc33a86b1221   # inn: south exit

# Both directional links for the bakery↔inn door pair. Duplicated in
# millholm/inn.yaml per the cross-file convention in docs/links.md, so a
# partial rebuild of either file restores the pair.
#
# A reference is opaque, so each one carries a trailing comment naming
# what it points at. The comment is for the reader; the id is the truth.
links:
  - entity:    27030dd8-b228-471b-826a-dc33a86b1221   # inn: south exit
    attribute: other_side
    points_to: db662d8a-a8b1-4c84-93a1-516855a2f691   # bakery: north exit
  - entity:    db662d8a-a8b1-4c84-93a1-516855a2f691   # bakery: north exit
    attribute: other_side
    points_to: 27030dd8-b228-471b-826a-dc33a86b1221   # inn: south exit
